  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(560px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }
    .back { margin: 0 0 16px; }
    .back a {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }
    .back a:hover { text-decoration: underline; }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .note {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .grid a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 140px;
      padding: 18px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(228, 195, 106, 0.06);
      color: var(--ink);
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
    }
    .grid a:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .grid img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .legal {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .legal a { color: inherit; }
  </style>
</head>
