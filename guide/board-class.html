<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클래스 게시판 · 도건 게임 연구소</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="board-frame.css">
  <style>
    :root {
      --bg: #0c0a08;
      --gold: #e4c36a;
      --muted: #cbb994;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: #f6edd6;
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(560px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }
    .back { margin: 0 0 16px; }
    .back a {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }
    .back a:hover { text-decoration: underline; }
    .class-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .class-grid a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 120px;
      padding: 16px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
    }
    .class-grid img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .legal {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .legal a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="./">처음으로</a></p>
    <div class="parchment-frame">
      <span class="nail tl" aria-hidden="true"></span>
      <span class="nail tr" aria-hidden="true"></span>
      <span class="nail bl" aria-hidden="true"></span>
      <span class="nail br" aria-hidden="true"></span>
      <h1 class="pf-title">클래스 게시판</h1>
      <p class="pf-note">클래스를 선택하면 해당 게시판으로 이동합니다.</p>
      <div class="class-grid">
        <a href="board.html?b=class-prince"><img src="class-icons/lord.png" alt="">군주</a>
        <a href="board.html?b=class-knight"><img src="class-icons/knight.png" alt="">기사</a>
        <a href="board.html?b=class-elf"><img src="class-icons/elf.png" alt="">요정</a>
        <a href="board.html?b=class-mage"><img src="class-icons/mage.png" alt="">마법사</a>
      </div>
    </div>
    <p class="legal"><a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a></p>
  </div>
</body>
</html>
