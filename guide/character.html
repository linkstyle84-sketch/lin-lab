<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 캐릭터 · 도건 게임 연구소</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="topnav.css?v=1">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
      --panel: #1a1612;
      --slot: #0d0b09;
      --hp: #e8a0b8;
      --mp: #9ec8ef;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 420px at 50% -80px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap { width: min(1100px, calc(100% - 20px)); margin: 0 auto; padding: 20px 0 48px; }
    .wip-banner {
      margin: 0 0 14px;
      padding: 12px 16px;
      border: 1px solid rgba(228, 195, 106, 0.45);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(228, 195, 106, 0.16), rgba(228, 195, 106, 0.06));
      color: var(--gold);
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .foot a { color: var(--gold); font-weight: 800; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 12px;
    }
    .class-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .class-picker .label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      margin-right: 2px;
    }
    .class-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 68px;
      padding: 8px 6px 7px;
      border: 1px solid rgba(228,195,106,.28);
      border-radius: 12px;
      background: linear-gradient(180deg, #1b1510, #120e0b);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.1;
      transition: border-color .15s, box-shadow .15s, color .15s, background .15s;
    }
    .class-btn img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(0 0 6px rgba(228,195,106,.25));
      pointer-events: none;
    }
    .class-btn:hover, .class-btn:focus-visible {
      border-color: rgba(228,195,106,.7);
      color: var(--gold);
      outline: none;
    }
    .class-btn[aria-pressed="true"] {
      border-color: rgba(228,195,106,.95);
      color: var(--gold);
      background: linear-gradient(180deg, #2a2116, #17110c);
      box-shadow: 0 0 0 2px rgba(228,195,106,.28), inset 0 0 14px rgba(228,195,106,.12);
    }
    .class-btn[aria-pressed="true"] img {
      filter: drop-shadow(0 0 8px rgba(228,195,106,.45));
    }
    .sheet {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(228,195,106,.08), transparent 28%),
        var(--panel);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .sheet-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 900;
    }
    .sheet-top .top-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 14px;
      background: rgba(228, 195, 106, 0.1);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .sheet-top .top-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .sheet-top .top-btn.danger { color: #f0b4a0; }
    .sheet-top .top-btn.danger:hover { border-color: #f0b4a0; color: #ffd2c4; }
    #level { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .sheet-body {
      display: grid;
      grid-template-columns: minmax(320px, 1.15fr) minmax(240px, 0.85fr);
      gap: 0;
      min-height: 560px;
    }
    .stats {
      padding: 16px 14px 18px;
      border-left: 1px solid var(--line);
      background: linear-gradient(270deg, #15110e, #1a1612);
      min-height: 200px;
    }
    .stats-placeholder {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      padding: 28px 8px;
      opacity: 0.75;
    }
    .hidden-fields {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: 800;
    }
    .row .label { color: var(--muted); }
    .row .value { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .row input {
      width: 72px;
      border: 1px solid rgba(228,195,106,.22);
      border-radius: 6px;
      padding: 5px 6px;
      background: #0c0a08;
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      text-align: right;
    }
    .row input.wide { width: 118px; }
    .row.hp .num { color: var(--hp); }
    .row.mp .num { color: var(--mp); }
    .step { display: inline-flex; flex-direction: column; gap: 2px; }
    .step button {
      width: 18px;
      height: 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0;
      background: #241c14;
      color: var(--gold);
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }
    .divider {
      height: 1px;
      margin: 10px 0;
      background: var(--line);
    }
    .resist {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .resist label {
      display: grid;
      gap: 4px;
      justify-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .resist input { width: 100%; text-align: center; }
    .paper {
      position: relative;
      padding: 10px 10px 12px;
      background: #0a0908;
    }
    .paper-stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      container-type: inline-size;
    }
    /* 장비칸 아이콘 ≈ 슬롯(15.2%)의 78% — 장비창 폭 기준으로 맞춤 */
    .side-rail {
      --gear-ico: min(62px, calc((100cqi - 120px) * 0.152 * 0.78));
      flex: 0 0 auto;
      width: calc(var(--gear-ico) + 44px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
    }
    .side-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }
    .side-ctrl {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .side-ico {
      width: var(--gear-ico);
      height: var(--gear-ico);
      object-fit: contain;
      image-rendering: pixelated;
      background: #000;
      border: 1px solid rgba(180, 180, 180, 0.35);
      border-radius: 2px;
      flex: 0 0 auto;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.75));
    }
    .side-step {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 1px solid rgba(160, 160, 160, 0.55);
      border-radius: 2px;
      background: linear-gradient(180deg, #3a3a3a, #1a1a1a);
      color: #f0f0f0;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .side-step:hover { border-color: var(--gold); color: var(--gold); }
    .side-label {
      width: 100%;
      color: var(--ink);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .side-label.has { color: var(--gold); }
    .side-pick {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .side-pick:hover .side-ico { border-color: var(--gold); }
    .side-pick:hover .side-label { color: var(--gold); }
    .doll-wrap {
      position: relative;
      width: min(100%, 520px);
      margin: 0;
      container-type: inline-size;
    }
    .doll-bg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      user-select: none;
      pointer-events: none;
    }
    .stat-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .stat-val {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      color: #fff;
      font-family: "Noto Serif KR", "Times New Roman", Times, Georgia, serif;
      font-weight: 900;
      font-size: clamp(15px, 2.7cqw, 20px);
      letter-spacing: 0.02em;
      line-height: 1;
      -webkit-text-stroke: 0.35px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -1px 0 0 #000,
         1px 0 0 #000,
         0 -1px 0 #000,
         0 2px 0 #000,
         0 2px 2px #000;
      white-space: nowrap;
      user-select: none;
    }
    .stat-val.lbl {
      justify-content: center;
      padding: 0;
      font-size: clamp(12px, 2.15cqw, 16px);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: transparent;
      color: #fff;
      -webkit-text-stroke: 0.3px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -1px 0 0 #000,
         1px 0 0 #000,
         0 -1px 0 #000,
         0 2px 0 #000;
    }
    .stat-val.cover {
      background: transparent;
      box-shadow: none;
      font-size: clamp(15px, 2.7cqw, 20px);
      -webkit-text-stroke: 0.35px #fff;
    }
    .stat-val.hp {
      color: var(--hp);
      -webkit-text-stroke: 0.35px var(--hp);
    }
    .stat-val.mp {
      color: var(--mp);
      -webkit-text-stroke: 0.35px var(--mp);
    }
    .stat-ctrl {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0;
      box-sizing: border-box;
      padding: 0;
      pointer-events: none;
    }
    .stat-ctrl .stat-num {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      color: #fff;
      font-family: "Noto Serif KR", "Times New Roman", Times, Georgia, serif;
      font-weight: 900;
      font-size: clamp(15px, 2.7cqw, 20px);
      line-height: 1;
      text-align: center;
      -webkit-text-stroke: 0.35px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -1px 0 0 #000,
         1px 0 0 #000,
         0 -1px 0 #000,
         0 2px 0 #000;
      user-select: none;
    }
    .stat-btn {
      flex: 0 0 auto;
      width: clamp(16px, 3.45cqw, 24px);
      height: clamp(16px, 3.45cqw, 24px);
      padding: 0;
      border: 0;
      background: transparent url("ui/stat-up.png") center / contain no-repeat;
      cursor: pointer;
      pointer-events: auto;
      image-rendering: pixelated;
    }
    .stat-btn.down { background-image: url("ui/stat-down.png"); }
    .stat-btn:disabled,
    .stat-btn[aria-disabled="true"] {
      cursor: default;
      background-image: url("ui/stat-up-off.png");
    }
    .stat-btn.down:disabled,
    .stat-btn.down[aria-disabled="true"] {
      background-image: url("ui/stat-down-off.png");
    }
    .stat-btn:focus-visible {
      outline: 1px solid rgba(228, 195, 106, 0.9);
      outline-offset: 1px;
    }
    .gear {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .slot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      box-sizing: border-box;
      overflow: visible;
    }
    .slot:hover, .slot:focus-visible {
      border-color: transparent;
      outline: none;
    }
    .slot:hover::after, .slot:focus-visible::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(228, 195, 106, 0.95);
      border-radius: 2px;
      box-shadow: 0 0 0 2px rgba(228, 195, 106, 0.35), inset 0 0 12px rgba(228, 195, 106, 0.18);
      pointer-events: none;
    }
    .slot img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.75));
    }
    .slot.empty { background: rgba(0, 0, 0, 0.18); overflow: hidden; }
    .slot .guide {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      width: 100%;
      height: 100%;
      padding: 2px;
      color: rgba(228, 195, 106, 0.72);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      user-select: none;
    }
    .slot.empty .guide { display: flex; }
    .slot.extra {
      position: relative;
      left: auto;
      top: auto;
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      border: 1px solid rgba(228,195,106,.28);
      border-radius: 10px;
      background: linear-gradient(180deg, #1b1510, var(--slot));
      font-weight: 900;
    }
    .slot.extra .v { display: block; position: static; transform: none; max-width: none; border: 0; background: none; color: var(--ink); font-size: 12px; }
    .slot.extra.empty .v { display: none; }
    .slot.extra .guide {
      color: rgba(203,185,148,.55);
      font-size: 12px;
      text-shadow: none;
    }
    .slot.extra.empty .guide { display: flex; flex-direction: row; gap: 4px; }
    .paper-foot {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-top: 10px;
      z-index: 1;
    }
    .align {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      background: rgba(0,0,0,.25);
    }
    .er-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 900;
    }
    .er-box input { width: 64px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 0;
    }
    .actions button, .actions a.btn {
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 10px;
      background: rgba(228, 195, 106, 0.1);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .actions button:hover, .actions a.btn:hover { border-color: var(--gold); color: var(--gold); }
    .actions button.danger { color: #f0b4a0; }
    .actions .wide { grid-column: 1 / -1; }
    .google { min-height: 44px; margin: 10px 0 0; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.55; }
    .status { min-height: 1.4em; margin: 8px 0 0; color: var(--gold); font-size: 14px; font-weight: 800; }
    .foot { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: 13px; font-weight: 800; }
    .gate, .modal-bg {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: #140f0c;
    }
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      border: 0;
      border-radius: 0;
      padding: 20px;
    }
    .modal {
      width: min(480px, 100%);
      max-height: min(820px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #17120e;
    }
    .modal h2 { margin: 0 0 10px; font-size: 18px; }
    .modal input, .modal select {
      width: 100%;
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #0c0a08;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
    }
    .weapon-cats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 10px;
    }
    .weapon-cats[hidden] { display: none !important; }
    .weapon-cat {
      border: 1px solid rgba(228,195,106,.35);
      border-radius: 999px;
      padding: 6px 10px;
      background: #15110c;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .weapon-cat:hover {
      border-color: var(--gold);
      color: var(--ink);
    }
    .weapon-cat[aria-pressed="true"] {
      border-color: var(--gold);
      background: rgba(228,195,106,.16);
      color: var(--gold);
    }
    .pick-list {
      display: grid;
      gap: 6px;
      max-height: min(52vh, 480px);
      overflow: auto;
      margin: 0 0 10px;
      padding: 4px;
      border: 1px solid rgba(228,195,106,.16);
      border-radius: 12px;
      background: #100c09;
    }
    .pick-item {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }
    .pick-item.on {
      grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1fr) auto;
    }
    .pick-item:hover, .pick-item.on { border-color: var(--gold); background: rgba(228,195,106,.1); }
    .pick-item img { width: 32px; height: 32px; object-fit: contain; }
    .pick-item .meta { color: var(--muted); font-size: 12px; font-weight: 700; }
    .pick-item .opt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }
    .pick-item.on .opt { max-width: 160px; }
    .pick-enchant {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      pointer-events: auto;
    }
    .pick-enchant .enc-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid rgba(228,195,106,.45);
      border-radius: 8px;
      background: #1a1510;
      color: var(--gold);
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }
    .pick-enchant .enc-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .pick-enchant .enc-val {
      min-width: 42px;
      text-align: center;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
    }
    .pick-enchant .enc-hint {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pick-empty { padding: 16px 8px; color: var(--muted); font-size: 13px; font-weight: 700; text-align: center; }
    .modal .row-actions { display: flex; gap: 8px; }
    .modal .row-actions button { flex: 1; }
    .confirm-bg {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }
    .confirm-card {
      width: min(360px, 100%);

      if (resolve) resolve(result);

    function openConfirm(message, buttons) {
      return new Promise(function (resolve) {
        if (!confirmBg || !confirmMsg || !confirmActions) {
          resolve(false);
          return;
        }
        confirmResolver = resolve;
        confirmMsg.textContent = message;
        confirmActions.innerHTML = '';

          if (btn.danger) el.className = 'danger';
          el.addEventListener('click', function () { closeConfirm(btn.value); });
          confirmActions.appendChild(el);
        });
        confirmBg.hidden = false;
      });
    }

    var CLASS_BASE = {
      '군주': { str: 13, dex: 10, con: 10, wis: 11, cha: 13, int: 10, food: 8 },
      '기사': { str: 16, dex: 12, con: 14, wis: 9, cha: 12, int: 8, food: 4 },
      '요정': { str: 11, dex: 12, con: 12, wis: 12, cha: 9, int: 12, food: 7 },
      '마법사': { str: 8, dex: 7, con: 12, wis: 12, cha: 8, int: 12, food: 16 },
      '도적': { str: 15, dex: 11, con: 11, wis: 14, cha: 8, int: 9, food: 7 }
    };

    function classBase() {
      return CLASS_BASE[selectedCls] || CLASS_BASE['요정'];
    }

      return CLASS_LC[selectedCls] || 'elf';

    function statFloor(id) {
      var base = classBase();
      return Number(base[id]) || 1;
    }
    function statCap(id) {
      if (id === 'str' && STR_CAP_CLASSES[selectedCls]) return 20;
      return 18;

    function setField(id, value) {
      var el = document.getElementById(id);

    function round2(n) {
      return Math.round(n * 100) / 100;
    }
    /* lcinfo.io/classes — CON → 레벨당 HP 성장 */
    function hpGainPerLevel(con) {
      var id = classLcId();
      var scaled = con <= 18 ? con : 18 + (con - 18) * 0.6;
      var s = 0;
      var o = 0;
      if (id === 'prince') {
        s = 5;
        o = Math.max(5, scaled - 10);
      } else if (id === 'knight') {
        s = 6;
        o = Math.max(6, scaled - 9);
      } else if (id === 'elf') {
        s = 5;
        o = Math.max(5, scaled - 10);
      } else {
        s = 3;
        o = Math.max(3, scaled - 12);
      }
      var min = round2(o);
      var max = round2(s + o);
      return { min: min, max: max, avg: round2((min + max) / 2) };
    }
    function baseHpAt1(con) {
      var id = classLcId();
      var base = id === 'prince' ? 14 : id === 'knight' ? 16 : id === 'elf' ? 15 : 12;
      if (con >= 16) base += 1;
      if (con >= 17) base += 1;
      if (con >= 18) base += 1;
      if (con >= 21) base += Math.floor((con - 17) / 2);
      return base;
    }
    function calcHpRange(level, con) {
      var gain = hpGainPerLevel(con);
      var base = baseHpAt1(con);
      var lv = Math.max(1, Math.trunc(level) || 1);
      return {
        min: Math.floor(base + gain.min * (lv - 1)),
        max: Math.floor(base + gain.max * (lv - 1)),
        avg: Math.floor(base + gain.avg * (lv - 1))
      };
    }
    /* lcinfo.io/classes — WIS → 레벨당 MP 성장 */
    function mpGainPerLevel(wis) {
      var id = classLcId();
      var o = 0;
      var min = 0;
      var max = 0;
      if (id === 'prince') {
        o = 3 + (wis - 11) * 0.25;
        min = o - 1;
        max = o + 1;
      } else if (id === 'knight') {
        o = 1 + (wis - 9) * 0.187;
        if (wis >= 10) o += 0.363;
        min = o - 1;
        max = o + 1;
      } else if (id === 'elf') {
        o = 4.5 + (wis - 12) * 0.4;
        min = o - 1.5;
        max = o + 1.5;
      } else {
        o = 6.5 + (wis - 12) * 0.5;
        min = o - 2;
        max = o + 2;
      }
      o = Math.round(o * 1000) / 1000;
      return { min: Math.floor(min), max: Math.ceil(max), avg: o };
    }
    function baseMpAt1() {
      var id = classLcId();
      return id === 'prince' ? 2 : id === 'knight' ? 1 : id === 'elf' ? 4 : 6;
    }
    function calcMpRange(level, wis) {
      var gain = mpGainPerLevel(wis);
      var base = baseMpAt1();
      var lv = Math.max(1, Math.trunc(level) || 1);
      return {
        min: Math.floor(base + gain.min * (lv - 1)),
        max: Math.floor(base + gain.max * (lv - 1)),
        avg: Math.floor(base + gain.avg * (lv - 1))
      };
    }
    /* lcinfo.io/classes — INT → Magic Bonus */
    function calcMagicBonus(intStat) {
      var id = classLcId();
      var a = Math.max(0, Math.trunc(intStat) || 0);
      if (id === 'prince') return Math.min(2, Math.floor(a / 10));
      if (id === 'knight') return Math.min(1, Math.floor(a / 50));
      if (id === 'elf') return Math.min(6, Math.floor(a / 8));
      return Math.min(10, Math.floor(a / 4));
    }
    /* lcinfo.io/classes — Level → Magic Level */
    function calcMagicLevel(level) {
      var id = classLcId();
      var r = Math.max(0, Math.trunc(level) || 0);
      if (id === 'prince') return Math.floor(r / 5);
      if (id === 'elf') return Math.floor((r + 1) / 3);
      if (id === 'wizard') return Math.floor(r / 3);
      if (id === 'knight') return Math.floor(r / 6);
      return 0;
    }
    function syncDerivedStats() {
      var level = num('level');
      var con = num('con');
      var wis = num('wis');
      var intStat = num('int');
      if (!Number.isFinite(level) || level < LEVEL_MIN) level = LEVEL_MIN;
      if (!Number.isFinite(con)) con = statFloor('con');
      if (!Number.isFinite(wis)) wis = statFloor('wis');
      if (!Number.isFinite(intStat)) intStat = statFloor('int');
      var hp = calcHpRange(level, con);
      var mp = calcMpRange(level, wis);
      setField('hp', hp.avg);
      setField('hpMax', hp.avg);
      setField('mp', mp.avg);
      setField('mpMax', mp.avg);
      setField('magicBonus', calcMagicBonus(intStat));
      setField('magicLevel', calcMagicLevel(level));
    }
    function adjustLevel(dir) {
      var cur = num('level');
      if (!Number.isFinite(cur) || cur < LEVEL_MIN) cur = LEVEL_MIN;
      if (dir > 0) {
        if (cur >= LEVEL_MAX) return;
        setField('level', cur + 1);
      } else if (dir < 0) {
        if (cur <= LEVEL_MIN) return;
        setField('level', cur - 1);
      }
      paintStatOverlays();
      paintSideRail();
    }
    function ensureElixir() {
      if (!sheet) return { str: 0, dex: 0, con: 0, int: 0, wis: 0, cha: 0 };
      if (!sheet.elixir || typeof sheet.elixir !== 'object') {
        sheet.elixir = { str: 0, dex: 0, con: 0, int: 0, wis: 0, cha: 0 };
      }
      STAT_IDS.forEach(function (id) {
        var n = Number(sheet.elixir[id]);
        sheet.elixir[id] = Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
      });
      return sheet.elixir;
    }
    function elixirOf(id) {
      return Number(ensureElixir()[id]) || 0;
    }
    function ensureBuffs() {
      if (!sheet) return {};
      if (!sheet.buffs || typeof sheet.buffs !== 'object') sheet.buffs = {};
      return sheet.buffs;
    }
    function adjustStat(id, dir) {
      if (id === 'level') {
        adjustLevel(dir);
        return;
      }
      if (STAT_IDS.indexOf(id) === -1) return;
      var cur = num(id);
      var food = num('food');
      var floor = statFloor(id) + elixirOf(id);
      var cap = statCap(id) + elixirOf(id);
      if (dir > 0) {
        if (food <= 0 || cur >= cap) return;
        setField(id, cur + 1);
        setField('food', food - 1);
      } else if (dir < 0) {
        if (cur <= floor) return;
        setField(id, cur - 1);
        setField('food', food + 1);
      }
      paintStatOverlays();
      paintSideRail();
    }
    function adjustElixir(id, dir) {
      if (STAT_IDS.indexOf(id) === -1) return;
      if (num('level') < ELIXIR_MIN_LEVEL) {
        alertPopup('50래벨이상만 사용할 수 있습니다');
        return;
      }
      var e = ensureElixir();
      var curE = Number(e[id]) || 0;
      var cur = num(id);
      if (dir > 0) {
        if (curE >= ELIXIR_MAX) return;
        e[id] = curE + 1;
        setField(id, cur + 1);
      } else if (dir < 0) {
        if (curE <= 0) return;
        e[id] = curE - 1;
        setField(id, Math.max(statFloor(id), cur - 1));
      }
      sheet.elixir = e;
      paintStatOverlays();
      paintSideRail();
    }

      if (sheet) {

    function paintStatOverlays() {
      if (!statOverlayEl) return;
      syncDerivedStats();
      recomputeAc();

      var foodLeft = num('food');
      STAT_OVERLAYS.forEach(function (row) {

          wrap.style.height = row.h + '%';
          var cur = num(row.id);
          var floor = row.level ? LEVEL_MIN : (statFloor(row.id) + elixirOf(row.id));
          var cap = row.level ? LEVEL_MAX : (statCap(row.id) + elixirOf(row.id));
          var canDown = cur > floor;
          var canUp = row.level ? (cur < cap) : (foodLeft > 0 && cur < cap);

          var down = document.createElement('button');
          down.type = 'button';
          down.className = 'stat-btn down';
          down.setAttribute('aria-label', row.level ? '레벨 하락' : (row.id + ' 하락'));

            adjustStat(row.id, -1);
          });

          var numEl = document.createElement('span');
          numEl.className = 'stat-num';
          numEl.textContent = Number.isFinite(cur) ? String(cur) : '';

          var up = document.createElement('button');
          up.type = 'button';
          up.className = 'stat-btn up';
          up.setAttribute('aria-label', row.level ? '레벨 상승' : (row.id + ' 상승'));
          up.disabled = !canUp;
          up.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            adjustStat(row.id, 1);
          });

          wrap.appendChild(down);
          wrap.appendChild(numEl);
          wrap.appendChild(up);
          statOverlayEl.appendChild(wrap);
          return;
        }
        var el = document.createElement('span');
        el.className = 'stat-val'
          + (row.lbl ? ' lbl' : '')
          + (row.cover ? ' cover' : '')
          + (row.tone === 'hp' ? ' hp' : '')
          + (row.tone === 'mp' ? ' mp' : '');
        el.style.left = row.l + '%';
        el.style.top = row.t + '%';
        el.style.width = row.w + '%';
        el.style.height = row.h + '%';

          if (row.format === 'pair') {

          }
        } else {

    function escapeHtml(s) {

    function findBuff(id) {

    /* DPS 측정기와 동일: 기사 전용 / 요정 전용·숨김 공통 / 그 외는 공통만 */

    var pickEnchant = 0;
    function canWearItem(it) {
      if (!it || !it.k || !it.k.length) return true;
      return it.k.indexOf(selectedCls) !== -1;
    }
    function itemEnchantMax(item) {
      if (editKey === 'doll') return 0;
      var max = item && item.max != null ? Number(item.max) : 15;
      if (!Number.isFinite(max) || max < 0) max = 15;
      /* 무기는 안전인첸(보통 6)과 별개로 시뮬상 11강까지 허용. 인첸불가(max=0)는 유지 */
      if (editKey === 'weapon' && max > 0) max = 11;
      return max;
    }
    function clampPickEnchant(item) {
      var max = itemEnchantMax(item);
      if (!Number.isFinite(pickEnchant) || pickEnchant < 0) pickEnchant = 0;
      if (pickEnchant > max) pickEnchant = max;
      return max;
    }
    function buildEnchantControl(item) {
      var max = clampPickEnchant(item);
      var wrap = document.createElement('div');
      wrap.className = 'pick-enchant';
      wrap.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
      });

      var down = document.createElement('button');
      down.type = 'button';
      down.className = 'enc-btn';
      down.setAttribute('aria-label', '강화 하락');
      down.textContent = '−';
      down.disabled = pickEnchant <= 0 || max <= 0;

      var val = document.createElement('span');
      val.className = 'enc-val';
      val.textContent = max <= 0 ? '불가' : ('+' + pickEnchant);

      var up = document.createElement('button');
      up.type = 'button';
      up.className = 'enc-btn';
      up.setAttribute('aria-label', '강화 상승');
      up.textContent = '+';
      up.disabled = pickEnchant >= max || max <= 0;

      var hint = document.createElement('span');
      hint.className = 'enc-hint';
      hint.textContent = max > 0 ? ('0~' + max) : '';

      down.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (pickEnchant <= 0) return;
        pickEnchant -= 1;
        renderPickList();
      });
      up.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (pickEnchant >= max) return;
        pickEnchant += 1;
        renderPickList();
      });

      wrap.appendChild(down);
      wrap.appendChild(val);
      wrap.appendChild(up);
      if (hint.textContent) wrap.appendChild(hint);
      return wrap;
    }

    function paintOneSlot(slot, host, extra) {
      var btn = document.createElement('button');
      var value = (sheet.gear && sheet.gear[slot.key]) || '';
      var label = gearLabel(value);
      var icon = gearIcon(value);
      var caption = slotCaption(slot, label);
      btn.type = 'button';
      btn.className = 'slot' + (extra ? ' extra' : '') + (label ? '' : ' empty');
      btn.dataset.key = slot.key;
      btn.setAttribute('aria-label', slot.label + (label ? ': ' + caption : ' 선택'));
      if (!extra) {
        btn.style.left = slot.l + '%';
        btn.style.top = slot.t + '%';
        btn.style.width = slot.w + '%';
        btn.style.height = slot.h + '%';
      }
      if (!label) {
        var guide = document.createElement('span');
        guide.className = 'guide';
        if (extra) {
          guide.textContent = slot.label + ' 선택';
        } else {
          guide.appendChild(document.createTextNode(slot.label));
          guide.appendChild(document.createElement('br'));
          guide.appendChild(document.createTextNode('선택'));
        }
        btn.appendChild(guide);
      }
      if (icon) {
        var img = document.createElement('img');
        if (slot.key === 'doll') img.src = (String(icon).indexOf('/') >= 0 ? icon : ('dolls/' + icon));
        else img.src = 'item-icons/' + icon;
        img.alt = '';
        btn.appendChild(img);
      }
      if (label) {
        btn.addEventListener('mouseenter', function () {
          showIconTip(btn, gearTipHtml(slot, value, label));
        });
        btn.addEventListener('mouseleave', hideIconTip);
      }
      btn.addEventListener('click', function () {
        if (slot.key === 'doll') {
          openIconModal('doll');
          return;
        }
        openSlot(slot.key, slot.label);
      });
      host.appendChild(btn);
    }

    function paintGear() {
      gearEl.innerHTML = '';
      if (gearExtraEl) gearExtraEl.innerHTML = '';
      SLOTS.forEach(function (slot) { paintOneSlot(slot, gearEl, false); });
      if (gearExtraEl) {
        EXTRA_SLOTS.forEach(function (slot) { paintOneSlot(slot, gearExtraEl, true); });
      }
    }

    function paintWeaponCats() {
      if (!weaponCatsEl) return;
      if (editKey !== 'weapon') {
        weaponCatsEl.hidden = true;
        weaponCatsEl.innerHTML = '';
        return;
      }
      weaponCatsEl.hidden = false;
      weaponCatsEl.innerHTML = '';
      WEAPON_CATS.forEach(function (cat) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'weapon-cat';
        btn.textContent = cat;
        btn.setAttribute('aria-pressed', cat === weaponCat ? 'true' : 'false');
        btn.addEventListener('click', function () {
          weaponCat = cat;
          paintWeaponCats();
          renderPickList();
        });
        weaponCatsEl.appendChild(btn);
      });
    }

    function itemListForSlot(key, query) {
      var cats = SLOT_CATS[key] || [];
      var q = String(query || '').trim().toLowerCase();
      var out = [];
      if (key === 'doll') {
        var dolls = window.DBITEMS || {};
        Object.keys(dolls).forEach(function (id) {
          var it = dolls[id];
          if (!it || !it.n || it.n.indexOf('인형') === -1) return;
          if (q && it.n.toLowerCase().indexOf(q) === -1) return;
          out.push({
            id: id,
            name: it.n,
            icon: it.i || '',
            cat: it.c || '마법인형',
            ac: null,
            max: 0,
            opt: Array.isArray(it.o) ? it.o.join(', ') : ''
          });
        });
      } else {
        var src = window.DBGEAR || {};
        Object.keys(src).forEach(function (id) {
          var it = src[id];
          if (!it || !it.n) return;
          if (cats.length && cats.indexOf(it.c) === -1) return;
          if (key === 'weapon' && weaponCat !== '전체' && it.c !== weaponCat) return;
          if (key === 'weapon' && /화살/.test(it.n)) return;
          if (!canWearItem(it)) return;
          if (q && it.n.toLowerCase().indexOf(q) === -1) return;
          out.push({
            id: id,
            name: it.n,
            icon: it.i || '',
            cat: it.c || '',
            ac: it.a != null ? Number(it.a) : null,
            max: it.max != null ? Number(it.max) : 15,
            opt: it.o || ''
          });
        });
      }
      out.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
      return out;
    }

    function renderPickList() {
      var q = document.getElementById('modal-search').value;
      var list = itemListForSlot(editKey, q);
      pickList.innerHTML = '';
      if (!list.length) {
        pickList.innerHTML = '<div class="pick-empty">검색 결과가 없습니다.</div>';
        return;
      }
      if (picked) clampPickEnchant(picked);
      list.forEach(function (it) {
        var row = document.createElement('div');
        var selected = picked && String(picked.id) === String(it.id);
        row.className = 'pick-item' + (selected ? ' on' : '');
        row.setAttribute('role', 'button');
        row.tabIndex = 0;

        if (it.icon) {
          var img = document.createElement('img');
          img.alt = '';
          img.src = 'item-icons/' + it.icon;
          row.appendChild(img);
        } else {
          row.appendChild(document.createElement('span'));
        }

        var info = document.createElement('span');
        var nameEl = document.createElement('b');
        nameEl.textContent = it.name;
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = it.cat + (it.ac != null ? ' · AC ' + (-it.ac) : '');
        info.appendChild(nameEl);
        info.appendChild(meta);
        row.appendChild(info);

        var opt = document.createElement('span');
        opt.className = 'opt';
        opt.textContent = it.opt || '';
        row.appendChild(opt);

        if (selected && editKey !== 'doll') {
          row.appendChild(buildEnchantControl(it));
        }

        function selectRow() {
          var same = picked && String(picked.id) === String(it.id);
          picked = it;
          if (!same) {
            pickEnchant = 0;
            clampPickEnchant(it);
          }
          renderPickList();
        }
        row.addEventListener('click', selectRow);
        row.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectRow();
          }
        });
        pickList.appendChild(row);
      });
    }

    /* 레벨 AC: 군주·마법사 8렙당 -1, 기사 7렙당 -1, 요정 6렙당 -1 (도적은 미정) */
    function levelAcBonus() {
      var level = Math.max(0, Math.trunc(num('level')) || 0);
      if (selectedCls === '요정') return Math.trunc(level / 6);
      if (selectedCls === '기사') return Math.trunc(level / 7);
      if (selectedCls === '군주' || selectedCls === '마법사') return Math.trunc(level / 8);
      return 0;
    }
    function gearNames() {
      var gear = (sheet && sheet.gear) || {};
      var names = [];
      Object.keys(gear).forEach(function (key) {
        var g = gear[key];
        if (g && typeof g === 'object' && g.name) names.push(g.name);
      });
      return names;
    }
    /* 수호 세트(반지+목걸이+벨트) AC -1 */
    function setAcBonus() {
      var names = gearNames();
      var has = function (n) { return names.indexOf(n) !== -1; };
      var bonus = 0;
      if (has('수호의 반지') && has('수호의 목걸이') && has('수호의 벨트')) bonus += 1;
      return bonus;
    }
    function lookupGearAc(name) {
      var src = window.DBGEAR || {};
      var ids = Object.keys(src);
      for (var i = 0; i < ids.length; i++) {
        var it = src[ids[i]];
        if (it && it.n === name && it.a != null) return Number(it.a) || 0;
      }
      return null;
    }
    function gearPieceAc(g) {
      if (!g || typeof g !== 'object') return 0;
      var base = g.ac;
      if (base == null && g.name) base = lookupGearAc(g.name);
      if (base == null) return 0;
      return (Number(base) || 0) + (Number(g.enchant) || 0);
    }
    function buffAcBonus() {
      var on = ensureBuffs();
      var bonus = 0;
      (window.DBBUFFS || []).forEach(function (b) {
        if (!on[b.id]) return;
        var ac = Number(b.ac);
        if (Number.isFinite(ac) && ac > 0) bonus += ac;
      });
      return bonus;
    }
    function recomputeAc() {
      var sum = 0;
      var gear = (sheet && sheet.gear) || {};
      Object.keys(gear).forEach(function (key) {
        sum += gearPieceAc(gear[key]);
      });
      sum += setAcBonus();
      sum += buffAcBonus();
      setField('ac', 10 - sum - levelAcBonus());
    }

    function openSlot(key, label) {
      editKey = key;
      picked = null;
      weaponCat = '전체';
      var current = sheet.gear && sheet.gear[key];
      if (current && typeof current === 'object') {
        picked = {
          id: current.id,
          name: current.name,
          icon: current.icon || '',
          cat: current.cat || '',
          ac: current.ac != null ? Number(current.ac) : null,
          max: current.max != null ? Number(current.max) : 15,
          opt: current.opt || ''
        };
        if (key === 'weapon' && current.cat && WEAPON_CATS.indexOf(current.cat) !== -1) {
          weaponCat = current.cat;
        }
      }
      document.getElementById('modal-title').textContent = label + ' 선택 · ' + (selectedCls || '');
      document.getElementById('modal-search').value = '';
      pickEnchant = current && typeof current === 'object' ? (Number(current.enchant) || 0) : 0;
      if (key === 'weapon' && !pickEnchant) pickEnchant = Number(sheet.weaponEnchant) || 0;
      if (picked) clampPickEnchant(picked);
      paintWeaponCats();
      modal.hidden = false;
      renderPickList();
      document.getElementById('modal-search').focus();
    }

    function closeModal() {
      modal.hidden = true;
      editKey = '';
      picked = null;
      pickEnchant = 0;
      weaponCat = '전체';
      if (weaponCatsEl) {
        weaponCatsEl.hidden = true;
        weaponCatsEl.innerHTML = '';
      }
    }

    function buildPayload() {
      var form = readForm();
      var payload = DgMember.dpsFromSheet(form);
      payload.sheet = form;
      return payload;
    }

    document.querySelectorAll('.row[data-stat] .step button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('.row').dataset.stat;
        adjustStat(id, Number(btn.dataset.dir));
      });
    });
    ['level', 'food', 'str', 'dex', 'con', 'int', 'wis', 'cha', 'ac'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.readOnly = true;
      el.addEventListener('keydown', function (e) { e.preventDefault(); });
    });

    document.getElementById('modal-search').addEventListener('input', renderPickList);
    document.getElementById('modal-ok').addEventListener('click', function () {
      if (!editKey) return;
      if (!picked || !picked.name) {
        say('목록에서 아이템을 선택해 주세요.');
        return;
      }
      sheet = readForm();
      var maxEnc = clampPickEnchant(picked);
      var enc = pickEnchant;
      sheet.gear[editKey] = {
        id: picked.id,
        name: picked.name,
        icon: picked.icon || '',
        cat: picked.cat || '',
        ac: picked.ac,
        max: maxEnc,
        opt: picked.opt || '',
        enchant: enc
      };
      if (editKey === 'weapon') sheet.weaponEnchant = enc;
      recomputeAc();
      paintGear();
      paintStatOverlays();
      closeModal();
    });
    document.getElementById('modal-clear').addEventListener('click', function () {
      if (!editKey) return;
      sheet = readForm();
      sheet.gear[editKey] = '';
      if (editKey === 'weapon') sheet.weaponEnchant = 0;
      recomputeAc();
      paintGear();
      paintStatOverlays();
      closeModal();
    });
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    if (iconModal) {
      iconModal.addEventListener('click', function (e) {
        if (e.target === iconModal) closeIconModal();
      });
    }
    var iconModalOk = document.getElementById('icon-modal-ok');
    if (iconModalOk) iconModalOk.addEventListener('click', closeIconModal);
    window.addEventListener('scroll', hideIconTip, true);
    window.addEventListener('resize', hideIconTip);

    function saveLocal(payload) {
      var session = DgMember.getSession() || {};
      DgMember.setCharacterCache(session.email, payload);
      DgMember.writeDpsLocal(payload);
    }

    function saveToCloud(payload) {
      say('내 캐릭터를 저장하는 중입니다.');
      return DgMember.call({ action: 'character_save', character: payload }).then(function (data) {
        var saved = data.character || payload;
        saveLocal(saved);
        if (saved.sheet) fillForm(saved.sheet);
        document.getElementById('google').hidden = true;
        say('저장했습니다. DPS 측정기를 열면 자동으로 반영됩니다.');
      });
    }

    document.getElementById('class-picker').addEventListener('click', function (e) {
      var btn = e.target.closest('.class-btn');
      if (!btn) return;
      setClass(btn.dataset.cls, true);
    });

    document.getElementById('btn-save').addEventListener('click', function () {
      var payload = buildPayload();
      saveLocal(payload);
      if (!DgMember.connected()) {
        say('저장했습니다. DPS 측정기에는 반영됩니다. (클라우드 키 미설정)');
        alertPopup('저장되었습니다.');
        return;
      }
      if (!DgMember.getSession()) {
        say('이 기기에는 반영됐습니다. 계정 저장은 로그인 후 가능합니다.');
        alertPopup('저장되었습니다.');
        return;
      }
      saveToCloud(payload)
        .then(function () { return alertPopup('저장되었습니다.'); })
        .catch(function (err) { say(err.message); });
    });

    document.getElementById('btn-clear').addEventListener('click', function () {
      confirmPopup('내 캐릭터가 삭제됩니다').then(function (ok) {
        if (!ok) return;
        function done() {
          DgMember.clearCharacterCache();
          fillForm(DgMember.defaultSheet());
          say('내 캐릭터를 삭제했습니다.');
        }
        if (DgMember.getSession() && DgMember.connected()) {
          say('삭제하는 중입니다.');
          DgMember.call({ action: 'character_clear' }).then(done).catch(function (err) {
            say(err.message);
          });
          return;
        }
        done();
      });
    });

    var wait = setInterval(function () {
      if (!window.DgMember) return;
      clearInterval(wait);
      var session = DgMember.getSession();
      if (!session || !session.email) {
        document.getElementById('need-login').hidden = false;
        return;
      }
      document.getElementById('panel').hidden = false;
      var cache = DgMember.getCharacterCache();
      if (cache && cache.data && cache.data.sheet && (!cache.email || cache.email === session.email)) {
        fillForm(cache.data.sheet);
        DgMember.writeDpsLocal(cache.data);
      } else {
        fillForm(DgMember.defaultSheet());
      }
      if (DgMember.connected()) {
        DgMember.call({ action: 'character_load' }).then(function (data) {
          if (!data.character) return;
          DgMember.setCharacterCache(session.email, data.character, data.updated_at);
          DgMember.writeDpsLocal(data.character);
          fillForm(data.character.sheet || DgMember.defaultSheet());
          say('계정 캐릭터를 불러왔습니다.');
        }).catch(function () {});
      }
    }, 100);
  </script>
</body>
</html>
