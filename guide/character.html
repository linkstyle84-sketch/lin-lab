<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 캐릭터 · 도건 게임 연구소</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 420px at 50% -80px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap { width: min(760px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 48px; }
    .back { margin: 0 0 14px; }
    .back a, .foot a { color: var(--gold); font-weight: 800; text-decoration: none; }
    .back a:hover, .foot a:hover { text-decoration: underline; }
    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px 22px;
      background: #140f0c;
    }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 900; letter-spacing: -0.03em; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.65; }
    .summary {
      margin: 0 0 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(228, 195, 106, 0.06);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.7;
    }
    .summary b { color: var(--gold); }
    .summary ul { margin: 8px 0 0; padding-left: 18px; }
    .actions { display: grid; gap: 10px; margin: 0 0 14px; }
    .actions button, .actions a.btn {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(228, 195, 106, 0.1);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .actions button:hover, .actions a.btn:hover { border-color: var(--gold); color: var(--gold); }
    .actions button.danger { color: #f0b4a0; }
    .google { min-height: 44px; margin: 0 0 12px; }
    .hint { margin: 0 0 10px; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.55; }
    .status { min-height: 1.4em; margin: 8px 0 0; color: var(--gold); font-size: 14px; font-weight: 800; }
    .foot { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 13px; font-weight: 800; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="./">처음으로</a></p>
    <div class="card">
      <h1>내 캐릭터</h1>
      <p class="lead">계정당 캐릭터 1개입니다. 클래스·레벨·스탯·무기·버프·AC/ER는 DPS 측정기에서 편집한 뒤, 여기서 계정에 저장합니다. 같은 계정으로 다시 로그인하면 불러올 수 있고, 측정기를 열면 자동으로 적용됩니다.</p>
      <div id="need-login" hidden>
        <p class="hint">내 캐릭터를 쓰려면 먼저 로그인해 주세요.</p>
        <div class="actions"><a class="btn" href="join.html#login">로그인하러 가기</a></div>
      </div>
      <div id="panel" hidden>
        <div class="summary" id="summary">저장된 캐릭터가 없습니다.</div>
        <p class="hint">계정과 동기화하려면 아래 Google 확인이 한 번 필요합니다.</p>
        <div id="google" class="google"></div>
        <div class="actions">
          <button type="button" id="btn-pull">계정에서 불러오기</button>
          <button type="button" id="btn-push">측정기 설정을 계정에 저장</button>
          <button type="button" id="btn-apply">측정기에 적용</button>
          <a class="btn" href="/dps/">측정기에서 편집하기</a>
          <button type="button" id="btn-clear" class="danger">계정 캐릭터 삭제</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
    </div>
    <p class="foot"><a href="./">홈</a> · <a href="join.html#login">로그인</a> · <a href="/dps/">DPS 측정기</a></p>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="member-config.js"></script>
  <script src="member.js"></script>
  <script>
    var status = document.getElementById('status');
    var summary = document.getElementById('summary');
    var needLogin = document.getElementById('need-login');
    var panel = document.getElementById('panel');
    var token = '';
    var painted = false;

    function say(text) { status.textContent = text || ''; }

    function buffCount(set) {
      if (!set || typeof set !== 'object') return 0;
      return Object.keys(set).filter(function (k) { return !!set[k]; }).length;
    }

    function paintSummary() {
      var cache = DgMember.getCharacterCache();
      var session = DgMember.getSession();
      if (!cache || !cache.data || (session && cache.email && cache.email !== session.email)) {
        summary.textContent = '저장된 캐릭터가 없습니다. 측정기에서 설정한 뒤 「측정기 설정을 계정에 저장」을 눌러 주세요.';
        return;
      }
      var d = cache.data;
      var weapons = Array.isArray(d.rows) ? d.rows : [];
      var names = weapons.slice(0, 8).map(function (row) {
        return (row.name || '무기') + (row.enchant != null ? ' +' + row.enchant : '');
      });
      var html = '<div><b>' + (d.cls || '-') + '</b> · 레벨 ' + (d.level != null ? d.level : '-') +
        ' · 스탯 ' + (d.stat != null ? d.stat : '-') +
        ' · AC ' + (d.ac != null ? d.ac : '-') +
        ' · ER ' + (d.er != null ? d.er : '-') +
        ' · 리덕션 ' + (d.extraDr != null ? d.extraDr : '-') + '</div>';
      html += '<div>버프 켜짐: 요정 ' + buffCount(d.buffsElf) + ' · 기사 ' + buffCount(d.buffsKnight) +
        ' · 근거리 ' + buffCount(d.buffsElfMelee) + '</div>';
      html += '<div>무기 ' + weapons.length + '개' + (cache.updatedAt ? ' · 저장 ' + cache.updatedAt.replace('T', ' ').slice(0, 19) : '') + '</div>';
      if (names.length) html += '<ul>' + names.map(function (n) { return '<li>' + n + '</li>'; }).join('') +
        (weapons.length > names.length ? '<li>…</li>' : '') + '</ul>';
      summary.innerHTML = html;
    }

    function needToken() {
      if (token) return true;
      say('먼저 Google 확인 버튼을 눌러 주세요.');
      return false;
    }

    function onCredential(idToken) {
      token = idToken;
      say('Google 확인됨. 불러오기 또는 저장을 눌러 주세요.');
    }

    document.getElementById('btn-pull').addEventListener('click', function () {
      if (!needToken()) return;
      say('계정에서 불러오는 중입니다.');
      DgMember.call({ action: 'character_load', idToken: token }).then(function (data) {
        var session = DgMember.getSession() || {};
        if (!data.character) {
          DgMember.clearCharacterCache();
          paintSummary();
          say('계정에 저장된 캐릭터가 없습니다.');
          return;
        }
        DgMember.setCharacterCache(session.email, data.character, data.updated_at);
        DgMember.writeDpsLocal(data.character);
        paintSummary();
        say('불러왔습니다. 측정기를 열면 자동으로 적용됩니다.');
      }).catch(function (err) { say(err.message); });
    });

    document.getElementById('btn-push').addEventListener('click', function () {
      if (!needToken()) return;
      var local = DgMember.readDpsLocal();
      if (!local) {
        say('측정기 설정이 없습니다. 먼저 측정기에서 캐릭터를 설정해 주세요.');
        return;
      }
      var snap = DgMember.characterSnapshot(local);
      say('계정에 저장하는 중입니다.');
      DgMember.call({ action: 'character_save', idToken: token, character: snap }).then(function (data) {
        var session = DgMember.getSession() || {};
        DgMember.setCharacterCache(session.email, data.character || snap, data.updated_at);
        paintSummary();
        say('계정에 저장했습니다.');
      }).catch(function (err) { say(err.message); });
    });

    document.getElementById('btn-apply').addEventListener('click', function () {
      var cache = DgMember.getCharacterCache();
      if (!cache || !cache.data) {
        say('적용할 캐릭터가 없습니다. 먼저 불러오거나 저장해 주세요.');
        return;
      }
      DgMember.writeDpsLocal(cache.data);
      say('측정기에 적용했습니다. 측정기 페이지를 열어 주세요.');
    });

    document.getElementById('btn-clear').addEventListener('click', function () {
      if (!needToken()) return;
      if (!window.confirm('계정에 저장된 내 캐릭터를 삭제할까요?')) return;
      say('삭제하는 중입니다.');
      DgMember.call({ action: 'character_clear', idToken: token }).then(function () {
        DgMember.clearCharacterCache();
        paintSummary();
        say('계정 캐릭터를 삭제했습니다.');
      }).catch(function (err) { say(err.message); });
    });

    var wait = setInterval(function () {
      if (!window.DgMember) return;
      clearInterval(wait);
      var session = DgMember.getSession();
      if (!session || !session.email) {
        needLogin.hidden = false;
        return;
      }
      panel.hidden = false;
      paintSummary();
      var ready = setInterval(function () {
        if (!window.google || !google.accounts || painted) return;
        if (!(window.MEMBER_CONFIG && MEMBER_CONFIG.clientId)) {
          clearInterval(ready);
          say('구글 로그인 설정이 없습니다.');
          return;
        }
        painted = true;
        clearInterval(ready);
        DgMember.renderGoogle(document.getElementById('google'), onCredential, { text: 'signin_with', width: 320 });
        if (!DgMember.connected()) say('회원 저장 서버를 연결하면 계정 동기화가 됩니다.');
      }, 200);
    }, 100);
  </script>
</body>
</html>
