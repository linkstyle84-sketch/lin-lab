<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 캐릭터 · 도건 게임 연구소</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="topnav.css?v=1">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
      --panel: #1a1612;
      --slot: #0d0b09;
      --hp: #e8a0b8;
      --mp: #9ec8ef;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 420px at 50% -80px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap { width: min(1100px, calc(100% - 20px)); margin: 0 auto; padding: 20px 0 48px; }
    .foot a { color: var(--gold); font-weight: 800; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 12px;
    }
    .class-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .class-picker .label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      margin-right: 2px;
    }
    .class-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 68px;
      padding: 8px 6px 7px;
      border: 1px solid rgba(228,195,106,.28);
      border-radius: 12px;
      background: linear-gradient(180deg, #1b1510, #120e0b);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.1;
      transition: border-color .15s, box-shadow .15s, color .15s, background .15s;
    }
    .class-btn img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(0 0 6px rgba(228,195,106,.25));
      pointer-events: none;
    }
    .class-btn:hover, .class-btn:focus-visible {
      border-color: rgba(228,195,106,.7);
      color: var(--gold);
      outline: none;
    }
    .class-btn[aria-pressed="true"] {
      border-color: rgba(228,195,106,.95);
      color: var(--gold);
      background: linear-gradient(180deg, #2a2116, #17110c);
      box-shadow: 0 0 0 2px rgba(228,195,106,.28), inset 0 0 14px rgba(228,195,106,.12);
    }
    .class-btn[aria-pressed="true"] img {
      filter: drop-shadow(0 0 8px rgba(228,195,106,.45));
    }
    .sheet {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(228,195,106,.08), transparent 28%),
        var(--panel);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 900;
    }
    .sheet-top .title { color: var(--gold); letter-spacing: 0.04em; }
    .sheet-body {
      display: grid;
      grid-template-columns: minmax(240px, 0.85fr) minmax(320px, 1.15fr);
      gap: 0;
      min-height: 560px;
    }
    .stats {
      padding: 16px 14px 18px;
      border-right: 1px solid var(--line);
      background: linear-gradient(90deg, #15110e, #1a1612);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: 800;
    }
    .row .label { color: var(--muted); }
    .row .value { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .row input {
      width: 72px;
      border: 1px solid rgba(228,195,106,.22);
      border-radius: 6px;
      padding: 5px 6px;
      background: #0c0a08;
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      text-align: right;
    }
    .row input.wide { width: 118px; }
    .row.hp .num { color: var(--hp); }
    .row.mp .num { color: var(--mp); }
    .step { display: inline-flex; flex-direction: column; gap: 2px; }
    .step button {
      width: 18px;
      height: 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0;
      background: #241c14;
      color: var(--gold);
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }
    .divider {
      height: 1px;
      margin: 10px 0;
      background: var(--line);
    }
    .resist {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .resist label {
      display: grid;
      gap: 4px;
      justify-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .resist input { width: 100%; text-align: center; }
    .paper {
      position: relative;
      padding: 10px 10px 12px;
      background: #0a0908;
    }
    .doll-wrap {
      position: relative;
      width: min(100%, 520px);
      margin: 0 auto;
      container-type: inline-size;
    }
    .doll-bg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      user-select: none;
      pointer-events: none;
    }
    .stat-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .stat-val {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      color: #fff;
      font-family: "Noto Serif KR", "Times New Roman", Times, Georgia, serif;
      font-weight: 900;
      font-size: clamp(15px, 2.7cqw, 20px);
      letter-spacing: 0.02em;
      line-height: 1;
      -webkit-text-stroke: 0.35px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -1px 0 0 #000,
         1px 0 0 #000,
         0 -1px 0 #000,
         0 2px 0 #000,
         0 2px 2px #000;
      white-space: nowrap;
      user-select: none;
    }
    .stat-val.lbl {
      justify-content: center;
      padding: 0;
      font-size: clamp(12px, 2.15cqw, 16px);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: transparent;
      color: #fff;
      -webkit-text-stroke: 0.3px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -1px 0 0 #000,
         1px 0 0 #000,
         0 -1px 0 #000,
         0 2px 0 #000;
    }
    .stat-val.cover {
      background: transparent;
      box-shadow: none;
      font-size: clamp(15px, 2.7cqw, 20px);
      -webkit-text-stroke: 0.35px #fff;
    }
    .stat-val.hp {
      color: var(--hp);
      -webkit-text-stroke: 0.35px var(--hp);
    }
    .stat-val.mp {
      color: var(--mp);
      -webkit-text-stroke: 0.35px var(--mp);
    }
    .stat-ctrl {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0;
      box-sizing: border-box;
      padding: 0;
      pointer-events: none;
    }
    .stat-ctrl .stat-num {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      color: #fff;
      font-family: "Noto Serif KR", "Times New Roman", Times, Georgia, serif;
      font-weight: 900;
      font-size: clamp(15px, 2.7cqw, 20px);
      line-height: 1;
      text-align: center;
      -webkit-text-stroke: 0.35px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -1px 0 0 #000,
         1px 0 0 #000,
         0 -1px 0 #000,
         0 2px 0 #000;
      user-select: none;
    }
    .stat-btn {
      flex: 0 0 auto;
      width: clamp(16px, 3.45cqw, 24px);
      height: clamp(16px, 3.45cqw, 24px);
      padding: 0;
      border: 0;
      background: transparent url("ui/stat-up.png") center / contain no-repeat;
      cursor: pointer;
      pointer-events: auto;
      image-rendering: pixelated;
    }
    .stat-btn.down { background-image: url("ui/stat-down.png"); }
    .stat-btn:disabled,
    .stat-btn[aria-disabled="true"] {
      cursor: default;
      background-image: url("ui/stat-up-off.png");
    }
    .stat-btn.down:disabled,
    .stat-btn.down[aria-disabled="true"] {
      background-image: url("ui/stat-down-off.png");
    }
    .stat-btn:focus-visible {
      outline: 1px solid rgba(228, 195, 106, 0.9);
      outline-offset: 1px;
    }
    .gear {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .slot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      box-sizing: border-box;
      overflow: hidden;
    }
    .slot:hover, .slot:focus-visible {
      border-color: rgba(228, 195, 106, 0.95);
      box-shadow: 0 0 0 2px rgba(228, 195, 106, 0.35), inset 0 0 12px rgba(228, 195, 106, 0.18);
      outline: none;
    }
    .slot img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.75));
    }
    .slot .v {
      display: none;
      position: absolute;
      left: 50%;
      bottom: calc(100% + 6px);
      transform: translateX(-50%);
      z-index: 5;
      width: max-content;
      max-width: 160px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12, 10, 8, 0.94);
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.35;
      white-space: normal;
      word-break: keep-all;
      pointer-events: none;
    }
    .slot:hover .v, .slot:focus-visible .v { display: block; }
    .slot.empty { background: rgba(0, 0, 0, 0.18); }
    .slot .guide {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      width: 100%;
      height: 100%;
      padding: 2px;
      color: rgba(228, 195, 106, 0.72);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      user-select: none;
    }
    .slot.empty .guide { display: flex; }
    .slot.extra {
      position: relative;
      left: auto;
      top: auto;
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      border: 1px solid rgba(228,195,106,.28);
      border-radius: 10px;
      background: linear-gradient(180deg, #1b1510, var(--slot));
      font-weight: 900;
    }
    .slot.extra .v { display: block; position: static; transform: none; max-width: none; border: 0; background: none; color: var(--ink); font-size: 12px; }
    .slot.extra.empty .v { display: none; }
    .slot.extra .guide {
      color: rgba(203,185,148,.55);
      font-size: 12px;
      text-shadow: none;
    }
    .slot.extra.empty .guide { display: flex; flex-direction: row; gap: 4px; }
    .paper-foot {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-top: 10px;
      z-index: 1;
    }
    .align {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      background: rgba(0,0,0,.25);
    }
    .er-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 900;
    }
    .er-box input { width: 64px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 0;
    }
    .actions button, .actions a.btn {
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 10px;
      background: rgba(228, 195, 106, 0.1);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .actions button:hover, .actions a.btn:hover { border-color: var(--gold); color: var(--gold); }
    .actions button.danger { color: #f0b4a0; }
    .actions .wide { grid-column: 1 / -1; }
    .google { min-height: 44px; margin: 10px 0 0; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.55; }
    .status { min-height: 1.4em; margin: 8px 0 0; color: var(--gold); font-size: 14px; font-weight: 800; }
    .foot { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: 13px; font-weight: 800; }
    .gate, .modal-bg {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: #140f0c;
    }
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      border: 0;
      border-radius: 0;
      padding: 20px;
    }
    .modal {
      width: min(480px, 100%);
      max-height: min(820px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #17120e;
    }
    .modal h2 { margin: 0 0 10px; font-size: 18px; }
    .modal input, .modal select {
      width: 100%;
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #0c0a08;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
    }
    .pick-list {
      display: grid;
      gap: 6px;
      max-height: 360px;
      overflow: auto;
      margin: 0 0 10px;
      padding: 4px;
      border: 1px solid rgba(228,195,106,.16);
      border-radius: 12px;
      background: #100c09;
    }
    .pick-item {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }
    .pick-item:hover, .pick-item.on { border-color: var(--gold); background: rgba(228,195,106,.1); }
    .pick-item img { width: 32px; height: 32px; object-fit: contain; }
    .pick-item .meta { color: var(--muted); font-size: 12px; font-weight: 700; }
    .pick-empty { padding: 16px 8px; color: var(--muted); font-size: 13px; font-weight: 700; text-align: center; }
    .modal .row-actions { display: flex; gap: 8px; }
    .modal .row-actions button { flex: 1; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .sheet-body { grid-template-columns: 1fr; }
      .stats { border-right: 0; border-bottom: 1px solid var(--line); }
      .doll-wrap { width: min(100%, 480px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="site-topnav" aria-label="바로가기">
      <a href="./">홈</a><span class="sep">·</span>
      <a href="items-weapon.html">아이템DB</a><span class="sep">·</span>
      <a href="monsters.html">몬스터DB</a><span class="sep">·</span>
      <a href="craft.html">제작DB</a><span class="sep">·</span>
      <a href="spells.html">마법DB</a><span class="sep">·</span>
      <a href="dolls.html">마법인형</a><span class="sep">·</span>
      <a href="/dps/">무기DPS측정기</a>
    </nav>
    <div id="need-login" class="gate" hidden>
      <p class="hint" style="margin:0 0 12px">내 캐릭터를 만들려면 먼저 로그인해 주세요.</p>
      <div class="actions"><a class="btn wide" href="join.html#login">로그인하러 가기</a></div>
    </div>
    <div id="panel" hidden>
      <div class="toolbar">
        <div class="class-picker" id="class-picker" role="group" aria-label="클래스 선택">
          <span class="label">클래스</span>
          <button type="button" class="class-btn" data-cls="군주" aria-pressed="false">
            <img src="class-icons/lord.png" alt="">군주
          </button>
          <button type="button" class="class-btn" data-cls="기사" aria-pressed="false">
            <img src="class-icons/knight.png" alt="">기사
          </button>
          <button type="button" class="class-btn" data-cls="요정" aria-pressed="true">
            <img src="class-icons/elf.png" alt="">요정
          </button>
          <button type="button" class="class-btn" data-cls="마법사" aria-pressed="false">
            <img src="class-icons/mage.png" alt="">마법사
          </button>
          <button type="button" class="class-btn" data-cls="도적" aria-pressed="false">
            <img src="class-icons/thief.png" alt="">도적
          </button>
        </div>
      </div>
      <section class="sheet" aria-label="캐릭터 정보">
        <div class="sheet-top">
          <div class="title">Level</div>
          <div class="value">
            <input id="level" class="wide" type="number" min="1" max="99" step="1" aria-label="레벨">
          </div>
        </div>
        <div class="sheet-body">
          <div class="stats">
            <div class="row hp"><span class="label">Hit Points</span><span class="value num"><input id="hp" type="number"> / <input id="hpMax" type="number"></span></div>
            <div class="row mp"><span class="label">Mana Points</span><span class="value num"><input id="mp" type="number"> / <input id="mpMax" type="number"></span></div>
            <div class="row"><span class="label">Armor Class</span><span class="value"><input id="ac" type="number"></span></div>
            <div class="divider"></div>
            <div class="row"><span class="label">Weight</span><span class="value"><input id="weight" type="number"> %</span></div>
            <div class="row"><span class="label">분배스탯</span><span class="value"><input id="food" type="number" min="0" step="1" aria-label="분배스탯"></span></div>
            <div class="divider"></div>
            <div class="row" data-stat="str"><span class="label">Str</span><span class="value"><input id="str" type="number"><span class="step"><button type="button" data-dir="1">▲</button><button type="button" data-dir="-1">▼</button></span></span></div>
            <div class="row" data-stat="dex"><span class="label">Dex</span><span class="value"><input id="dex" type="number"><span class="step"><button type="button" data-dir="1">▲</button><button type="button" data-dir="-1">▼</button></span></span></div>
            <div class="row" data-stat="con"><span class="label">Con</span><span class="value"><input id="con" type="number"><span class="step"><button type="button" data-dir="1">▲</button><button type="button" data-dir="-1">▼</button></span></span></div>
            <div class="row" data-stat="int"><span class="label">Int</span><span class="value"><input id="int" type="number"><span class="step"><button type="button" data-dir="1">▲</button><button type="button" data-dir="-1">▼</button></span></span></div>
            <div class="row" data-stat="wis"><span class="label">Wis</span><span class="value"><input id="wis" type="number"><span class="step"><button type="button" data-dir="1">▲</button><button type="button" data-dir="-1">▼</button></span></span></div>
            <div class="row" data-stat="cha"><span class="label">Cha</span><span class="value"><input id="cha" type="number"><span class="step"><button type="button" data-dir="1">▲</button><button type="button" data-dir="-1">▼</button></span></span></div>
            <div class="divider"></div>
            <div class="row"><span class="label">Magic Level</span><span class="value"><input id="magicLevel" type="number"></span></div>
            <div class="row"><span class="label">Magic Bonus</span><span class="value"><input id="magicBonus" type="number"></span></div>
            <div class="divider"></div>
            <div class="resist">
              <label>땅<input id="resistEarth" type="number"></label>
              <label>물<input id="resistWater" type="number"></label>
              <label>불<input id="resistFire" type="number"></label>
              <label>바람<input id="resistWind" type="number"></label>
            </div>
          </div>
          <div class="paper">
            <div class="doll-wrap">
              <img class="doll-bg" src="ui/character-status.png" alt="캐릭터 장비창" width="658" height="868" decoding="async">
              <div class="stat-overlay" id="stat-overlay" aria-hidden="true"></div>
              <div class="gear" id="gear" aria-label="장비 슬롯"></div>
            </div>
            <div id="gear-extra"></div>
            <div class="paper-foot">

  <script>
    var SLOT_CATS = {
      helmet: ['투구'],
      necklace: ['목걸이'],
      shirt: ['티셔츠'],
      armor: ['갑옷'],
      cloak: ['망토'],
      ring1: ['반지'],
      ring2: ['반지'],
      gloves: ['장갑'],
      belt: ['벨트'],
      shield: ['방패'],
      weapon: ['한손검', '양손검', '둔기', '창', '활', '단검', '지팡이'],
      boots: ['부츠'],
      doll: []
    };
    /* character-status.png 658x868 — 우물 edge-fit + 부위 재매핑 (86px) */
    var SLOTS = [
      { key: 'necklace', label: '목걸이', l: 54.26, t: 15.67, w: 13.07, h: 9.91 },
      { key: 'helmet', label: '투구', l: 69.76, t: 10.48, w: 13.07, h: 9.91 },
      { key: 'cloak', label: '망토', l: 73.86, t: 27.07, w: 13.07, h: 9.91 },
      { key: 'shirt', label: '티', l: 42.86, t: 27.19, w: 13.07, h: 9.91 },
      { key: 'armor', label: '갑옷', l: 58.51, t: 27.07, w: 13.07, h: 9.91 },
      { key: 'ring1', label: '반지(좌)', l: 29.64, t: 38.82, w: 13.07, h: 9.91 },
      { key: 'weapon', label: '무기', l: 30.55, t: 51.15, w: 13.07, h: 9.91 },
      { key: 'belt', label: '벨트', l: 60.33, t: 38.82, w: 13.07, h: 9.91 },
      { key: 'ring2', label: '반지(우)', l: 72.19, t: 53.23, w: 13.07, h: 9.91 },
      { key: 'gloves', label: '장갑', l: 44.98, t: 45.05, w: 13.07, h: 9.91 },
      { key: 'shield', label: '방패', l: 75.68, t: 41.94, w: 13.07, h: 9.91 },
      { key: 'boots', label: '신발', l: 75.53, t: 76.84, w: 13.07, h: 9.91 }
    ];
    var EXTRA_SLOTS = [
      { key: 'doll', label: '마법인형' }
    ];
    /* character-status.png — 분배스탯 + Str~Cha(하락/수치/상승) + HP/MP */
    var STAT_OVERLAYS = [
      { id: 'level', l: 31.55, t: 5.57, w: 14.14, h: 3.66, ctrl: true, level: true },
      { id: 'hp', l: 29.1, t: 12.55, w: 23.8, h: 3.7, derived: true, tone: 'hp' },
      { id: 'mp', l: 29.1, t: 16.95, w: 23.8, h: 3.7, derived: true, tone: 'mp' },
      { id: 'foodLbl', text: '분배스탯', l: 4.2, t: 31.9, w: 11.2, h: 2.8, lbl: true },
      { id: 'food', l: 24.8, t: 31.9, w: 9.4, h: 2.8, cover: true },
      { id: 'str', l: 14.55, t: 37.5, w: 13.2, h: 3.4, ctrl: true },
      { id: 'dex', l: 14.55, t: 41.8, w: 13.2, h: 3.4, ctrl: true },
      { id: 'con', l: 14.55, t: 46.2, w: 13.2, h: 3.4, ctrl: true },
      { id: 'int', l: 14.55, t: 50.5, w: 13.2, h: 3.4, ctrl: true },
      { id: 'wis', l: 14.55, t: 54.9, w: 13.2, h: 3.4, ctrl: true },
      { id: 'cha', l: 14.55, t: 59.2, w: 13.2, h: 3.4, ctrl: true }
    ];
    var STAT_IDS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    var LEVEL_MIN = 1;
    var LEVEL_MAX = 99;
    var STR_CAP_CLASSES = { '군주': 1, '기사': 1, '도적': 1 };
    /* lcinfo.io/classes 클래스 id (도적은 사이트 미제공 → 요정 성장 사용) */
    var CLASS_LC = {
      '군주': 'prince',
      '기사': 'knight',
      '요정': 'elf',
      '마법사': 'wizard',
      '도적': 'elf'
    };
    var FIELDS = ['level','exp','hp','hpMax','mp','mpMax','ac','weight','food','str','dex','con','int','wis','cha','magicLevel','magicBonus','resistEarth','resistWater','resistFire','resistWind','er'];
    var sheet = null;
    var token = '';
    var painted = false;
    var pendingCloudSave = false;
    var editKey = '';
    var picked = null;
    var status = document.getElementById('status');
    var gearEl = document.getElementById('gear');
    var gearExtraEl = document.getElementById('gear-extra');
    var statOverlayEl = document.getElementById('stat-overlay');
    var modal = document.getElementById('modal');
    var pickList = document.getElementById('pick-list');

    function say(text) { status.textContent = text || ''; }
    function num(id) {
      var el = document.getElementById(id);
      if (!el) return 0;
      return Number(el.value);
    }
    function gearLabel(value) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      return value.name || value.n || '';
    }
    function gearIcon(value) {
      if (!value || typeof value === 'string') return '';
      return value.icon || value.i || '';
    }

    var selectedCls = '요정';
    /* 캐릭터 생성 화면 기준: 좌 Str/Dex/Con, 우 Wis/Cha/Int, 중앙 Remaining Points=분배스탯 */
    var CLASS_BASE = {
      '군주': { str: 13, dex: 10, con: 10, wis: 11, cha: 13, int: 10, food: 8 },
      '기사': { str: 16, dex: 12, con: 14, wis: 9, cha: 12, int: 8, food: 4 },
      '요정': { str: 11, dex: 12, con: 12, wis: 12, cha: 9, int: 12, food: 7 },
      '마법사': { str: 8, dex: 7, con: 12, wis: 12, cha: 8, int: 12, food: 16 },
      '도적': { str: 15, dex: 11, con: 11, wis: 14, cha: 8, int: 9, food: 7 }
    };

    function classBase() {
      return CLASS_BASE[selectedCls] || CLASS_BASE['요정'];
    }
    function classLcId() {
      return CLASS_LC[selectedCls] || 'elf';
    }
    function statFloor(id) {
      var base = classBase();
      return Number(base[id]) || 1;
    }
    function statCap(id) {
      if (id === 'str' && STR_CAP_CLASSES[selectedCls]) return 20;
      return 18;
    }
    function setField(id, value) {
      var el = document.getElementById(id);
      if (!el) return;
      el.value = value;
      if (sheet) sheet[id] = value;
    }
    function round2(n) {
      return Math.round(n * 100) / 100;
    }
    /* lcinfo.io/classes — CON → 레벨당 HP 성장 */
    function hpGainPerLevel(con) {
      var id = classLcId();
      var scaled = con <= 18 ? con : 18 + (con - 18) * 0.6;
      var s = 0;
      var o = 0;
      if (id === 'prince') {
        s = 5;
        o = Math.max(5, scaled - 10);
      } else if (id === 'knight') {
        s = 6;
        o = Math.max(6, scaled - 9);
      } else if (id === 'elf') {
        s = 5;
        o = Math.max(5, scaled - 10);
      } else {
        s = 3;
        o = Math.max(3, scaled - 12);
      }
      var min = round2(o);
      var max = round2(s + o);
      return { min: min, max: max, avg: round2((min + max) / 2) };
    }
    function baseHpAt1(con) {
      var id = classLcId();
      var base = id === 'prince' ? 14 : id === 'knight' ? 16 : id === 'elf' ? 15 : 12;
      if (con >= 16) base += 1;
      if (con >= 17) base += 1;
      if (con >= 18) base += 1;
      if (con >= 21) base += Math.floor((con - 17) / 2);
      return base;
    }
    function calcHpRange(level, con) {
      var gain = hpGainPerLevel(con);
      var base = baseHpAt1(con);
      var lv = Math.max(1, Math.trunc(level) || 1);
      return {
        min: Math.floor(base + gain.min * (lv - 1)),
        max: Math.floor(base + gain.max * (lv - 1)),
        avg: Math.floor(base + gain.avg * (lv - 1))
      };
    }
    /* lcinfo.io/classes — WIS → 레벨당 MP 성장 */
    function mpGainPerLevel(wis) {
      var id = classLcId();
      var o = 0;
      var min = 0;
      var max = 0;
      if (id === 'prince') {
        o = 3 + (wis - 11) * 0.25;
        min = o - 1;
        max = o + 1;
      } else if (id === 'knight') {
        o = 1 + (wis - 9) * 0.187;
        if (wis >= 10) o += 0.363;
        min = o - 1;
        max = o + 1;
      } else if (id === 'elf') {
        o = 4.5 + (wis - 12) * 0.4;
        min = o - 1.5;
        max = o + 1.5;
      } else {
        o = 6.5 + (wis - 12) * 0.5;
        min = o - 2;
        max = o + 2;
      }
      o = Math.round(o * 1000) / 1000;
      return { min: Math.floor(min), max: Math.ceil(max), avg: o };
    }
    function baseMpAt1() {
      var id = classLcId();
      return id === 'prince' ? 2 : id === 'knight' ? 1 : id === 'elf' ? 4 : 6;
    }
    function calcMpRange(level, wis) {
      var gain = mpGainPerLevel(wis);
      var base = baseMpAt1();
      var lv = Math.max(1, Math.trunc(level) || 1);
      return {
        min: Math.floor(base + gain.min * (lv - 1)),
        max: Math.floor(base + gain.max * (lv - 1)),
        avg: Math.floor(base + gain.avg * (lv - 1))
      };
    }
    /* lcinfo.io/classes — INT → Magic Bonus */
    function calcMagicBonus(intStat) {
      var id = classLcId();
      var a = Math.max(0, Math.trunc(intStat) || 0);
      if (id === 'prince') return Math.min(2, Math.floor(a / 10));
      if (id === 'knight') return Math.min(1, Math.floor(a / 50));
      if (id === 'elf') return Math.min(6, Math.floor(a / 8));
      return Math.min(10, Math.floor(a / 4));
    }
    /* lcinfo.io/classes — Level → Magic Level */
    function calcMagicLevel(level) {
      var id = classLcId();
      var r = Math.max(0, Math.trunc(level) || 0);
      if (id === 'prince') return Math.floor(r / 5);
      if (id === 'elf') return Math.floor((r + 1) / 3);
      if (id === 'wizard') return Math.floor(r / 3);
      if (id === 'knight') return Math.floor(r / 6);
      return 0;
    }
    function syncDerivedStats() {
      var level = num('level');
      var con = num('con');
      var wis = num('wis');
      var intStat = num('int');
      if (!Number.isFinite(level) || level < LEVEL_MIN) level = LEVEL_MIN;
      if (!Number.isFinite(con)) con = statFloor('con');
      if (!Number.isFinite(wis)) wis = statFloor('wis');
      if (!Number.isFinite(intStat)) intStat = statFloor('int');
      var hp = calcHpRange(level, con);
      var mp = calcMpRange(level, wis);
      setField('hp', hp.avg);
      setField('hpMax', hp.avg);
      setField('mp', mp.avg);
      setField('mpMax', mp.avg);
      setField('magicBonus', calcMagicBonus(intStat));
      setField('magicLevel', calcMagicLevel(level));
    }
    function adjustLevel(dir) {
      var cur = num('level');
      if (!Number.isFinite(cur) || cur < LEVEL_MIN) cur = LEVEL_MIN;
      if (dir > 0) {
        if (cur >= LEVEL_MAX) return;
        setField('level', cur + 1);
      } else if (dir < 0) {
        if (cur <= LEVEL_MIN) return;
        setField('level', cur - 1);
      }
      paintStatOverlays();
    }
    function adjustStat(id, dir) {
      if (id === 'level') {
        adjustLevel(dir);
        return;
      }
      if (STAT_IDS.indexOf(id) === -1) return;
      var cur = num(id);
      var food = num('food');
      var floor = statFloor(id);
      var cap = statCap(id);
      if (dir > 0) {
        if (food <= 0 || cur >= cap) return;
        setField(id, cur + 1);
        setField('food', food - 1);
      } else if (dir < 0) {
        if (cur <= floor) return;
        setField(id, cur - 1);
        setField('food', food + 1);
      }
      paintStatOverlays();
    }

    function setClass(cls, applyStats) {
      selectedCls = cls || '요정';
      document.querySelectorAll('#class-picker .class-btn').forEach(function (btn) {
        btn.setAttribute('aria-pressed', btn.dataset.cls === selectedCls ? 'true' : 'false');
      });
      if (!applyStats) return;
      var base = classBase();
      ['str', 'dex', 'con', 'wis', 'cha', 'int', 'food'].forEach(function (id) {
        setField(id, base[id]);
      });
      if (sheet) sheet.cls = selectedCls;
      paintStatOverlays();
    }

    function paintStatOverlays() {
      if (!statOverlayEl) return;
      syncDerivedStats();
      statOverlayEl.innerHTML = '';
      var foodLeft = num('food');
      STAT_OVERLAYS.forEach(function (row) {
        if (row.ctrl) {
          var wrap = document.createElement('div');
          wrap.className = 'stat-ctrl';
          wrap.style.left = row.l + '%';
          wrap.style.top = row.t + '%';
          wrap.style.width = row.w + '%';
          wrap.style.height = row.h + '%';
          var cur = num(row.id);
          var floor = row.level ? LEVEL_MIN : statFloor(row.id);
          var cap = row.level ? LEVEL_MAX : statCap(row.id);
          var canDown = cur > floor;
          var canUp = row.level ? (cur < cap) : (foodLeft > 0 && cur < cap);

          var down = document.createElement('button');
          down.type = 'button';
          down.className = 'stat-btn down';
          down.setAttribute('aria-label', row.level ? '레벨 하락' : (row.id + ' 하락'));
          down.disabled = !canDown;
          down.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            adjustStat(row.id, -1);
          });

          var numEl = document.createElement('span');
          numEl.className = 'stat-num';
          numEl.textContent = Number.isFinite(cur) ? String(cur) : '';

          var up = document.createElement('button');
          up.type = 'button';
          up.className = 'stat-btn up';
          up.setAttribute('aria-label', row.level ? '레벨 상승' : (row.id + ' 상승'));
          up.disabled = !canUp;
          up.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            adjustStat(row.id, 1);
          });

          wrap.appendChild(down);
          wrap.appendChild(numEl);
          wrap.appendChild(up);
          statOverlayEl.appendChild(wrap);
          return;
        }
        var el = document.createElement('span');
        el.className = 'stat-val'
          + (row.lbl ? ' lbl' : '')
          + (row.cover ? ' cover' : '')
          + (row.tone === 'hp' ? ' hp' : '')
          + (row.tone === 'mp' ? ' mp' : '');
        el.style.left = row.l + '%';
        el.style.top = row.t + '%';
        el.style.width = row.w + '%';
        el.style.height = row.h + '%';
        if (row.lbl) {
          el.textContent = row.text || '';
        } else if (row.derived) {
          var curV = num(row.id);
          var maxV = num(row.id + 'Max');
          if (!Number.isFinite(curV)) curV = 0;
          if (!Number.isFinite(maxV)) maxV = curV;
          el.textContent = curV + '/' + maxV;
        } else {
          var v = num(row.id);
          el.textContent = Number.isFinite(v) ? String(v) : '';
        }
        statOverlayEl.appendChild(el);
      });
    }

    function fillForm(data) {
      sheet = Object.assign(DgMember.defaultSheet(), data || {});
      sheet.gear = Object.assign(DgMember.defaultSheet().gear, (data && data.gear) || {});
      setClass(sheet.cls || '요정', false);
      document.getElementById('alignment').value = sheet.alignment || '뉴트럴';
      FIELDS.forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.value = sheet[id] != null ? sheet[id] : '';
      });
      paintGear();
      paintStatOverlays();
    }

    function readForm() {
      var next = DgMember.defaultSheet();
      next.cls = selectedCls || '요정';
      next.name = (sheet && sheet.name) || '';
      next.alignment = document.getElementById('alignment').value;
      FIELDS.forEach(function (id) { next[id] = num(id); });
      next.weaponEnchant = Number(sheet && sheet.weaponEnchant) || 0;
      next.gear = Object.assign({}, (sheet && sheet.gear) || DgMember.defaultSheet().gear);
      sheet = next;
      return next;
    }

    function slotCaption(slot, label) {
      if (!label) return slot.label;
      if (slot.key === 'weapon' && sheet.weaponEnchant) return label + ' +' + sheet.weaponEnchant;
      return label;
    }

    function paintOneSlot(slot, host, extra) {
      var btn = document.createElement('button');
      var value = (sheet.gear && sheet.gear[slot.key]) || '';
      var label = gearLabel(value);
      var icon = gearIcon(value);
      var caption = slotCaption(slot, label);
      btn.type = 'button';
      btn.className = 'slot' + (extra ? ' extra' : '') + (label ? '' : ' empty');
      btn.dataset.key = slot.key;
      btn.title = label ? caption : (slot.label + ' 선택');
      btn.setAttribute('aria-label', slot.label + (label ? ': ' + caption : ' 선택'));
      if (!extra) {
        btn.style.left = slot.l + '%';
        btn.style.top = slot.t + '%';
        btn.style.width = slot.w + '%';
        btn.style.height = slot.h + '%';
      }
      if (label) {
        var tip = document.createElement('span');
        tip.className = 'v';
        tip.textContent = caption;
        btn.appendChild(tip);
      } else {
        var guide = document.createElement('span');
        guide.className = 'guide';
        if (extra) {
          guide.textContent = slot.label + ' 선택';
        } else {
          guide.appendChild(document.createTextNode(slot.label));
          guide.appendChild(document.createElement('br'));
          guide.appendChild(document.createTextNode('선택'));
        }
        btn.appendChild(guide);
      }
      if (icon) {
        var img = document.createElement('img');
        img.src = 'item-icons/' + icon;
        img.alt = '';
        btn.appendChild(img);
      }
      btn.addEventListener('click', function () { openSlot(slot.key, slot.label); });
      host.appendChild(btn);
    }

    function paintGear() {
      gearEl.innerHTML = '';
      if (gearExtraEl) gearExtraEl.innerHTML = '';
      SLOTS.forEach(function (slot) { paintOneSlot(slot, gearEl, false); });
      if (gearExtraEl) {
        EXTRA_SLOTS.forEach(function (slot) { paintOneSlot(slot, gearExtraEl, true); });
      }
    }

    function itemListForSlot(key, query) {
      var cats = SLOT_CATS[key] || [];
      var q = String(query || '').trim().toLowerCase();
      var out = [];
      var src = window.DBITEMS || {};
      Object.keys(src).forEach(function (id) {
        var it = src[id];
        if (!it || !it.n) return;
        if (key === 'doll') {
          if (it.n.indexOf('인형') === -1) return;
        } else if (cats.length && cats.indexOf(it.c) === -1) return;
        if (q && it.n.toLowerCase().indexOf(q) === -1) return;
        out.push({
          id: id,
          name: it.n,
          icon: it.i || '',
          cat: it.c || '',
          ac: it.a != null ? Number(it.a) : null,
          opt: Array.isArray(it.o) ? it.o.join(', ') : ''
        });
      });
      out.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
      return out.slice(0, 120);
    }

    function renderPickList() {
      var q = document.getElementById('modal-search').value;
      var list = itemListForSlot(editKey, q);
      pickList.innerHTML = '';
      if (!list.length) {
        pickList.innerHTML = '<div class="pick-empty">검색 결과가 없습니다.</div>';
        return;
      }
      list.forEach(function (it) {
        var btn = document.createElement('button');
        var selected = picked && String(picked.id) === String(it.id);
        btn.type = 'button';
        btn.className = 'pick-item' + (selected ? ' on' : '');
        btn.innerHTML = (it.icon ? '<img alt="">' : '<span></span>') +
          '<span><b></b><div class="meta"></div></span><span class="meta"></span>';
        if (it.icon) btn.querySelector('img').src = 'item-icons/' + it.icon;
        btn.querySelector('b').textContent = it.name;
        btn.querySelector('.meta').textContent = it.cat + (it.ac != null ? ' · AC ' + (-it.ac) : '');
        btn.lastChild.textContent = it.opt || '';
        btn.addEventListener('click', function () {
          picked = it;
          renderPickList();
        });
        pickList.appendChild(btn);
      });
    }

    function recomputeAc() {
      var sum = 0;
      var gear = (sheet && sheet.gear) || {};
      Object.keys(gear).forEach(function (key) {
        var g = gear[key];
        if (g && typeof g === 'object' && g.ac != null) sum += Number(g.ac) || 0;
      });
      document.getElementById('ac').value = 10 - sum;
    }

    function openSlot(key, label) {
      editKey = key;
      picked = null;
      var current = sheet.gear && sheet.gear[key];
      if (current && typeof current === 'object') picked = current;
      document.getElementById('modal-title').textContent = label + ' 선택';
      document.getElementById('modal-search').value = '';
      document.getElementById('enchant-wrap').hidden = key !== 'weapon';
      document.getElementById('modal-enchant').value = sheet.weaponEnchant || (picked && picked.enchant) || 0;
      modal.hidden = false;
      renderPickList();
      document.getElementById('modal-search').focus();
    }

    function closeModal() {
      modal.hidden = true;
      editKey = '';
      picked = null;
    }

    function buildPayload() {
      var form = readForm();
      var payload = DgMember.dpsFromSheet(form);
      payload.sheet = form;
      return payload;
    }

    document.querySelectorAll('.row[data-stat] .step button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('.row').dataset.stat;
        adjustStat(id, Number(btn.dataset.dir));
      });
    });
    ['level', 'food', 'str', 'dex', 'con', 'int', 'wis', 'cha'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.readOnly = true;
      el.addEventListener('keydown', function (e) { e.preventDefault(); });
    });

    document.getElementById('modal-search').addEventListener('input', renderPickList);
    document.getElementById('modal-ok').addEventListener('click', function () {
      if (!editKey) return;
      if (!picked || !picked.name) {
        say('목록에서 아이템을 선택해 주세요.');
        return;
      }
      sheet = readForm();
      sheet.gear[editKey] = {
        id: picked.id,
        name: picked.name,
        icon: picked.icon || '',
        ac: picked.ac,
        enchant: editKey === 'weapon' ? (Number(document.getElementById('modal-enchant').value) || 0) : 0
      };
      if (editKey === 'weapon') sheet.weaponEnchant = Number(document.getElementById('modal-enchant').value) || 0;
      recomputeAc();
      paintGear();
      closeModal();
    });
    document.getElementById('modal-clear').addEventListener('click', function () {
      if (!editKey) return;
      sheet = readForm();
      sheet.gear[editKey] = '';
      if (editKey === 'weapon') sheet.weaponEnchant = 0;
      recomputeAc();
      paintGear();
      closeModal();
    });
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

    function saveLocal(payload) {
      var session = DgMember.getSession() || {};
      DgMember.setCharacterCache(session.email, payload);
      DgMember.writeDpsLocal(payload);
    }

    function saveToCloud(payload) {
      say('내 캐릭터를 저장하는 중입니다.');
      return DgMember.call({ action: 'character_save', character: payload }).then(function (data) {
        var saved = data.character || payload;
        saveLocal(saved);
        if (saved.sheet) fillForm(saved.sheet);
        document.getElementById('google').hidden = true;
        say('저장했습니다. DPS 측정기를 열면 자동으로 반영됩니다.');
      });
    }

    document.getElementById('class-picker').addEventListener('click', function (e) {
      var btn = e.target.closest('.class-btn');
      if (!btn) return;
      setClass(btn.dataset.cls, true);
    });

    document.getElementById('btn-save').addEventListener('click', function () {
      var payload = buildPayload();
      saveLocal(payload);
      if (!DgMember.connected()) {
        say('저장했습니다. DPS 측정기에는 반영됩니다. (클라우드 키 미설정)');
        return;
      }
      if (!DgMember.getSession()) {
        say('이 기기에는 반영됐습니다. 계정 저장은 로그인 후 가능합니다.');
        return;
      }
      saveToCloud(payload).catch(function (err) { say(err.message); });
    });

    document.getElementById('btn-clear').addEventListener('click', function () {
      if (!window.confirm('내 캐릭터를 삭제할까요?')) return;
      function done() {
        DgMember.clearCharacterCache();
        fillForm(DgMember.defaultSheet());
        say('내 캐릭터를 삭제했습니다.');
      }
      if (DgMember.getSession() && DgMember.connected()) {
        say('삭제하는 중입니다.');
        DgMember.call({ action: 'character_clear' }).then(done).catch(function (err) {
          say(err.message);
        });
        return;
      }
      done();
    });

    var wait = setInterval(function () {
      if (!window.DgMember) return;
      clearInterval(wait);
      var session = DgMember.getSession();
      if (!session || !session.email) {
        document.getElementById('need-login').hidden = false;
        return;
      }
      document.getElementById('panel').hidden = false;
      var cache = DgMember.getCharacterCache();
      if (cache && cache.data && cache.data.sheet && (!cache.email || cache.email === session.email)) {
        fillForm(cache.data.sheet);
        DgMember.writeDpsLocal(cache.data);
      } else {
        fillForm(DgMember.defaultSheet());
      }
      if (DgMember.connected()) {
        DgMember.call({ action: 'character_load' }).then(function (data) {
          if (!data.character) return;
          DgMember.setCharacterCache(session.email, data.character, data.updated_at);
          DgMember.writeDpsLocal(data.character);
          fillForm(data.character.sheet || DgMember.defaultSheet());
          say('계정 캐릭터를 불러왔습니다.');
        }).catch(function () {});
      }
    }, 100);
  </script>
</body>
</html>
