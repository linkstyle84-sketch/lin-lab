<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 도건유튜브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0c0a08; --ink:#f6edd6; --muted:#cbb994; --gold:#e4c36a; --line:rgba(228,195,106,.28); }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:radial-gradient(900px 380px at 50% -60px,#3a2410 0%,transparent 62%),var(--bg); color:var(--ink); font-family:"Noto Sans KR",sans-serif; }
    .wrap { width:min(760px,calc(100% - 28px)); margin:0 auto; padding:36px 0 64px; }
    a { color:var(--gold); font-weight:800; text-decoration:none; }
    a:hover { text-decoration:underline; }
    h1 { margin:0 0 8px; font-size:28px; font-weight:900; letter-spacing:-.03em; }
    p, li { color:var(--muted); font-size:15px; font-weight:700; line-height:1.7; }
    .card { margin-top:18px; padding:18px; border:1px solid var(--line); border-radius:16px; background:rgba(228,195,106,.06); }
    label.age { display:flex; gap:10px; align-items:flex-start; color:var(--ink); font-weight:800; }
    label.age input { margin-top:4px; }
    #google { min-height:44px; margin-top:16px; }
    .status { min-height:1.5em; color:var(--gold); font-weight:800; }
    button { border:2px solid var(--gold); border-radius:14px; padding:10px 14px; background:rgba(228,195,106,.1); color:var(--gold); font:inherit; font-weight:900; cursor:pointer; }
    .legal { margin-top:28px; text-align:center; font-size:13px; font-weight:800; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="./">처음으로</a></p>
    <h1>회원가입</h1>
    <p>구글 계정으로 가입합니다. 비밀번호는 받지 않습니다. 구글 계정만으로는 나이를 알 수 없어, 만 14세 이상인지를 따로 확인합니다.</p>
    <p>저장하는 항목은 구글 이메일, 구글 식별값, 구글이 보내는 표시 이름, 가입 시각, 만 14세 이상 확인입니다. 전화번호, 주소, 주민등록번호는 받지 않습니다.</p>
    <div class="card">
      <label class="age"><input id="age" type="checkbox"> 만 14세 이상입니다.</label>
      <div id="google" hidden></div>
      <p class="status" id="status" role="status"></p>
      <p id="who" hidden></p>
      <button id="leave" type="button" hidden>탈퇴</button>
    </div>
    <p class="legal"><a href="admin.html">관리자</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a></p>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="member-config.js"></script>
  <script src="member.js"></script>
  <script>
    var age = document.getElementById('age');
    var slot = document.getElementById('google');
    var status = document.getElementById('status');
    var who = document.getElementById('who');
    var leave = document.getElementById('leave');
    var token = '';
    var painted = false;

    function say(text) { status.textContent = text || ''; }

    function showMember(member) {
      who.hidden = false;
      who.textContent = member.email + (member.name ? ' · ' + member.name : '') + ' 으로 가입되어 있습니다.';
      leave.hidden = false;
    }

    age.addEventListener('change', function () {
      if (!DgMember.connected()) {
        say('회원 저장 서버를 연결하면 구글 버튼이 열립니다.');
        return;
      }
      if (!age.checked) {
        slot.hidden = true;
        return;
      }
      slot.hidden = false;
      if (painted) return;
      painted = true;
      var wait = setInterval(function () {
        if (!window.google || !google.accounts) return;
        clearInterval(wait);
        try {
          DgMember.renderGoogle(slot, function (idToken) {
            if (!age.checked) {
              say('만 14세 이상 확인을 먼저 해 주세요.');
              return;
            }
            token = idToken;
            say('가입 내용을 저장하는 중입니다.');
            DgMember.call({ action: 'join', idToken: idToken, age14: true }).then(function (data) {
              say('가입되었습니다.');
              showMember(data.member || {});
            }).catch(function (err) {
              say(err.message);
            });
          });
        } catch (err) {
          say(err.message);
        }
      }, 200);
    });

    leave.addEventListener('click', function () {
      if (!token) return;
      leave.disabled = true;
      say('탈퇴 처리 중입니다.');
      DgMember.call({ action: 'leave', idToken: token }).then(function () {
        token = '';
        who.hidden = true;
        leave.hidden = true;
        say('탈퇴했습니다. 저장된 회원 정보를 지웠습니다.');
      }).catch(function (err) {
        leave.disabled = false;
        say(err.message);
      });
    });

    if (!DgMember.connected()) say('회원 저장 서버를 연결하면 구글 버튼이 열립니다.');
  </script>
</body>
</html>
