        return '<button type="button" class="chip drop-chip" data-mon="' + k + '">' + ico(MON[k], 24, 'mon-ico') + esc(MON[k].n) + ' <span class="more">Lv.' + MON[k].l + '</span></button>';
      }).join('') + '</div>';
      if (it.cr) h += '<p class="wpop-note"><a class="craft-link" href="craft.html?q=' + encodeURIComponent(it.n) + '">제작DB에서 제작법 보기 ›</a></p>';
      document.getElementById('ipop-body').innerHTML = h;
      ipop.hidden = false;
      ipop.querySelector('.wpop-card').scrollTop = 0;
    }
    function openMon(k) {
      var m = MON[k];
      document.getElementById('wpop-icon').outerHTML = ico(m, 64, 'mon-ico mon-ico-lg" id="wpop-icon');
      document.getElementById('wpop-name').textContent = m.n;
      document.getElementById('wpop-sub').textContent = '레벨 ' + m.l;
      var html = '<div class="wpop-line"><b>크기</b><span>' + (m.b ? '큰 몬스터' : '작은 몬스터') + '</span></div>' +
        '<div class="wpop-line"><b>속성</b><span>' + (m.u ? '언데드' : '—') + '</span></div>' +
        '<div class="wpop-line"><b>출현 지역</b><span class="pop-list">' + (m.r.length ? m.r.map(esc).join('<br>') : '—') + '</span></div>' +
        '<h4 class="pop-h">드롭 아이템</h4>';
      html += m.d.length ? m.d.map(function (c) {
        return '<div class="wpop-line"><b>' + esc(c[0]) + '</b><span class="chips">' + c[1].map(function (x) {
          var it = ITEMS[x[1]];
          return '<button type="button" class="chip drop-chip" data-item="' + x[1] + '" data-name="' + esc(x[0]) + '">' + (it ? '<img src="item-icons/' + it.i + '" alt="" loading="lazy">' : '') + esc(x[0]) + '</button>';
        }).join('') + '</span></div>';
      }).join('') : '<p class="wpop-note">드롭 정보 없음</p>';
      document.getElementById('wpop-body').innerHTML = html;
      pop.hidden = false;
      pop.querySelector('.wpop-card').scrollTop = 0;
    }
    render();
  </script>
</body>
</html>
