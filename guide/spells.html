      });
      if (cur.cls) list.sort(function (a, b) { return (a.lv[cur.cls] || 0) - (b.lv[cur.cls] || 0) || a.x - b.x; });
      count.textContent = '검색결과 ' + list.length + '건';
      rows.innerHTML = list.map(function (s) {
        return '<tr data-k="' + s.x + '"><td class="name"><img class="icon" src="spell-icons/' + s.i + '" alt="" loading="lazy">' + esc(s.n) + '</td>' +
          '<td>' + esc(s.g) + '</td><td class="cls">' + clsIcons(s, cur.cls) + '</td><td>' + (s.a || '—') + '</td><td>' + (s.e || '—') + '</td>' +
          '<td class="sp-cost">' + cost(s) + '</td><td>' + esc(s.du || '—') + '</td><td class="fx">' + esc(s.ds || '—') + '</td></tr>';
      }).join('');
    }
    document.querySelector('.cats').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      cur.cls = b.dataset.cls;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      render();
    });
    [['aligns', 'a'], ['elems', 'e']].forEach(function (p) {
      document.getElementById(p[0]).addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        cur[p[1]] = b.dataset.v;
        this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        render();
      });
    });
    input.addEventListener('input', render);
    function line(k, v) { return '<div class="wpop-line"><b>' + k + '</b><span>' + v + '</span></div>'; }
    function openSpell(k) {
      var s = SPELLS[k];
      document.getElementById('wpop-icon').src = 'spell-icons/' + s.i;
      document.getElementById('wpop-name').textContent = s.n;
      document.getElementById('wpop-sub').textContent = s.g;
      var h = line('클래스 · 습득 레벨', clsIcons(s)) +
        line('성향', s.a || '—') + line('속성', s.e || '—') + line('대상', esc(s.tg || '—')) + line('지속시간', esc(s.du || '—')) + line('소모', cost(s, true));
      if (s.ds) h += '<p class="item-desc">' + esc(s.ds) + '</p>';
      if (s.tb) {
        var known = DBITEMS[s.tb[2]];
        h += '<h4 class="pop-h">습득 방법</h4><div class="chips">' + (known ? '<button type="button" class="chip drop-chip" data-stack-item="' + s.tb[2] + '" data-name="' + esc(s.tb[0]) + '">' : '<span class="chip">') +
          (s.tb[1] ? '<img src="item-icons/' + s.tb[1] + '" alt="">' : '') + esc(s.tb[0]) + (known ? '</button>' : '</span>') + '</div>' + srcHtml(s.tb[0]);
      }
      document.getElementById('wpop-body').innerHTML = h;
      pop.hidden = false;
      pop.querySelector('.wpop-card').scrollTop = 0;
    }
    rows.addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-k]');
      if (tr) openSpell(tr.dataset.k);
    });
    render();
    var spell0 = new URLSearchParams(location.search).get('spell');
    var sk = spell0 ? SPELLS.findIndex(function (s) { return s.n === spell0; }) : -1;
    if (sk >= 0) openSpell(sk);
  </script>
</body>
</html>
